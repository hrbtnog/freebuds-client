[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freebuds-client"
version = "0.1.0"
description = "Cliente desktop não oficial para HUAWEI FreeBuds (Windows)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "FreeBuds Client contributors" }]
keywords = ["huawei", "freebuds", "bluetooth", "rfcomm", "spp", "windows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
# A UI usa apenas QtCore/QtGui/QtWidgets, presentes no pacote Essentials.
ui = ["PySide6-Essentials>=6.7"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
freebuds = "freebuds.cli.app:main"
freebuds-ui = "freebuds.ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"freebuds.ui" = ["assets/*.png", "assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
